html{background:var(--bgto)}

svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.gl{position:relative;overflow:hidden;color:#fff;text-decoration:none;text-shadow:0 1px 2px #00000026;border:1px solid rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 10px 24px var(--sh),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.1);transition:transform .12s}
.gl::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,0));pointer-events:none}
.gl>*{position:relative}.gl svg{filter:drop-shadow(0 1px 1px #00000030)}
.gl:active{transform:scale(.96)}
.c-blue{--g1:rgba(60,150,255,.86);--g2:rgba(0,100,230,.76);--sh:#007aff55}
.c-green{--g1:rgba(60,215,100,.86);--g2:rgba(30,160,70,.74);--sh:#34c75955}
.c-red{--g1:rgba(255,105,95,.88);--g2:rgba(235,50,40,.76);--sh:#ff3b3055}
.c-indigo{--g1:rgba(125,122,255,.88);--g2:rgba(80,78,210,.76);--sh:#5856d655}
.c-orange{--g1:rgba(255,179,64,.9);--g2:rgba(240,135,0,.78);--sh:#ff950055}
.c-teal{--g1:rgba(76,196,220,.88);--g2:rgba(30,160,185,.76);--sh:#30b0c755}
.c-purple{--g1:rgba(198,105,232,.88);--g2:rgba(160,70,210,.76);--sh:#af52de55}
.c-pink{--g1:rgba(255,107,142,.88);--g2:rgba(235,40,85,.76);--sh:#ff2d5555}
.primary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:58px;border-radius:20px;font-weight:600;font-size:16px}
.wide{width:100%;margin-top:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mini{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:80px;border-radius:20px;font-weight:600;font-size:13px}
.foot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 4px var(--blue)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
